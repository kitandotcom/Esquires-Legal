<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esquires' Legal</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face{
    font-family:'Matura MT Script Capitals';
    src:url('fonts/MATURASC.TTF') format('truetype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Bauhaus 93';
    src:url('fonts/BAUHS93.ttf') format('truetype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#F7F4ED;
    --ink:#14161A;
    --ink-grey:#5A5A60;
    --gold:#AD8A46;
    --blue:#1f3a5f;
    --script: 'Matura MT Script Capitals', cursive;
    --bauhaus: 'Bauhaus 93', sans-serif;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; text-align:center; padding:24px;
  }
  .wrap{ max-width:480px; }
  .brand{
    font-family:var(--script); font-weight:400;
    font-size:2.6rem; letter-spacing:0.01em; line-height:1;
    display:flex; align-items:baseline; justify-content:center; gap:0.6rem;
    margin-bottom:1.8rem;
  }
  .brand .brand-e{ color:var(--ink); font-family:var(--script); font-size:0.72em; letter-spacing:1ch; }
  .brand .brand-l{ color:var(--ink-grey); font-family:var(--bauhaus); font-weight:700;
    font-size:0.82em; letter-spacing:2ch; }
  .tagline{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:clamp(1.3rem,4vw,1.7rem); color:var(--blue); margin-bottom:1.6rem;
  }
  .rule{ width:56px; height:1px; background:var(--gold); margin:0 auto 1.6rem; }
  .contact{ font-size:0.92rem; color:var(--ink-grey); line-height:1.8; }
  .contact a{ color:var(--blue); text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="brand-e">Esquires'</span><span class="brand-l">Legal</span></div>
    <div class="tagline">Launching soon.</div>
    <div class="rule"></div>
    <div class="contact">
      <div><a href="tel:+2348150470073">+234 (0) 81 5047 0073</a></div>
      <div><a href="mailto:info@esquireslegal.com">info@esquireslegal.com</a></div>
    </div>
  </div>
</body>
</html>
