<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esquires' Legal — Submit a Post</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{ --ink:#1a1d24; --paper:#f7f5f0; --line:#ddd8cc; --blue:#1f3a5f; --gold:#a8863f; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--paper); color:var(--ink); }
  .wrap{ max-width:560px; margin:0 auto; padding:3rem 24px; }
  h1{ font-size:1.4rem; margin-bottom:0.3rem; }
  .sub{ color:#666; font-size:0.92rem; margin-bottom:2rem; }
  label{ display:block; font-size:0.8rem; font-weight:600; margin-bottom:0.3rem; margin-top:1.2rem; }
  input, textarea, select{ width:100%; padding:0.7rem; border:1px solid var(--line); background:#fff; font-size:0.95rem; font-family:inherit; border-radius:4px; }
  textarea{ min-height:220px; resize:vertical; }
  button{ margin-top:1.5rem; padding:0.8rem 1.6rem; background:var(--blue); color:#fff; border:none; border-radius:4px; font-size:0.95rem; cursor:pointer; }
  button:hover{ opacity:0.9; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .msg{ margin-top:1rem; font-size:0.88rem; padding:0.7rem; border-radius:4px; display:none; }
  .msg.ok{ display:block; background:#e6f4ea; color:#1e4620; }
  .msg.err{ display:block; background:#fbe9e7; color:#7a2b20; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; }
  .logout{ background:none; color:var(--blue); text-decoration:underline; padding:0; font-size:0.85rem; margin:0; }
  .hidden{ display:none; }
  .list-item{ border:1px solid var(--line); border-radius:6px; padding:0.9rem; margin-top:0.8rem; }
  .list-item .status{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gold); font-weight:600; }
  .post-thumb{ width:100%; max-height:140px; object-fit:cover; border-radius:4px; margin-bottom:0.6rem; display:block; }
  .tabs{ display:flex; gap:0.5rem; margin-top:1.5rem; border-bottom:1px solid var(--line); }
  .tab-btn{ margin:0; padding:0.6rem 0.2rem; background:none; color:#888; border:none; border-bottom:2px solid transparent; border-radius:0; font-size:0.9rem; font-weight:600; cursor:pointer; }
  .tab-btn.active{ color:var(--blue); border-bottom-color:var(--blue); }
  .tab-btn:hover{ opacity:1; }
  .panel{ margin-top:1.5rem; }
  .panel.hidden{ display:none; }
  .booking-item{ border:1px solid var(--line); border-radius:6px; padding:0.9rem; margin-top:0.8rem; }
  .booking-item .when{ font-size:0.72rem; color:#888; margin-bottom:0.4rem; }
  .booking-item .row{ font-size:0.9rem; margin-top:0.2rem; }
  .booking-item .row strong{ display:inline-block; min-width:100px; color:#555; font-weight:600; font-size:0.8rem; }
  .booking-item .status-row{ margin-top:0.7rem; display:flex; align-items:center; gap:0.6rem; }
  .booking-item .status-row select{ width:auto; padding:0.4rem 0.6rem; font-size:0.82rem; }
  .booking-item .status-saved{ font-size:0.78rem; color:#1e4620; display:none; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view">
    <h1>Esquires' Legal</h1>
    <p class="sub">Sign in to submit a blog post for review.</p>
    <label>Email</label>
    <input type="email" id="login-email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="login-password" autocomplete="current-password">
    <button id="login-btn">Sign In</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="app-view" class="hidden">
    <div class="topbar">
      <div>
        <h1>Submit a Post</h1>
        <p class="sub" id="whoami"></p>
      </div>
      <button class="logout" id="logout-btn">Sign out</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-posts-btn">Posts</button>
      <button class="tab-btn" id="tab-bookings-btn">Bookings</button>
    </div>

    <div class="panel" id="panel-posts">
      <label>Your Name (shown as the author)</label>
      <input type="text" id="post-author" placeholder="e.g. Jesse Otah">
      <label>Title</label>
      <input type="text" id="post-title" placeholder="Post title">
      <label>Content</label>
      <textarea id="post-content" placeholder="Write the post here..."></textarea>
      <label>Featured Image (optional)</label>
      <input type="file" id="post-image" accept="image/*">
      <button id="submit-btn">Submit for Review</button>
      <div class="msg" id="submit-msg"></div>

      <h2 style="font-size:1rem; margin-top:2.5rem;">Your Recent Submissions</h2>
      <p class="sub" style="margin-top:0.2rem;">Sent to the admin for review before they appear on the site.</p>
      <div id="my-posts"></div>
    </div>

    <div class="panel hidden" id="panel-bookings">
      <h2 style="font-size:1rem; margin-top:0;">Consultation Bookings</h2>
      <p class="sub" style="margin-bottom:1rem;">Booking requests submitted through the site. You can update each one's status.</p>
      <div id="bookings-list"></div>
    </div>
  </div>

</div>

<script>
  var sb = window.supabase.createClient(window.SITE_CONFIG.SUPABASE_URL, window.SITE_CONFIG.SUPABASE_ANON_KEY);

  var loginView = document.getElementById('login-view');
  var appView = document.getElementById('app-view');
  var loginMsg = document.getElementById('login-msg');
  var submitMsg = document.getElementById('submit-msg');

  function showMsg(el, text, isError){
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'err' : 'ok');
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtDate(iso){
    try{ return new Date(iso).toLocaleString(); } catch(e){ return iso; }
  }

  function slugify(s){
    return String(s || 'post').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function loadPosts(){
    sb.from('blog_posts').select('*').order('created_at', {ascending:false}).limit(20).then(function(res){
      var box = document.getElementById('my-posts');
      if(res.error || !res.data || !res.data.length){
        box.innerHTML = '<p class="sub">No submissions yet.</p>';
        return;
      }
      box.innerHTML = res.data.map(function(p){
        var thumb = p.image_url ? '<img class="post-thumb" src="' + escapeHtml(p.image_url) + '" alt="">' : '';
        return '<div class="list-item">' + thumb + '<div class="status">' + escapeHtml(p.status) + '</div>'
          + '<strong>' + escapeHtml(p.title) + '</strong><div class="sub">by ' + escapeHtml(p.author) + '</div>'
          + '</div>';
      }).join('');
    });
  }

  var bookingsLoaded = false;

  function loadBookings(){
    sb.from('bookings').select('*').order('created_at', {ascending:false}).limit(50)
      .then(function(res){
        var box = document.getElementById('bookings-list');
        if(res.error){
          box.innerHTML = '<p class="sub">Could not load bookings: ' + escapeHtml(res.error.message) + '</p>';
          return;
        }
        if(!res.data || !res.data.length){
          box.innerHTML = '<p class="sub">No bookings yet.</p>';
          return;
        }
        box.innerHTML = res.data.map(function(b){
          return '<div class="booking-item" data-id="' + b.id + '">'
            + '<div class="when">' + escapeHtml(fmtDate(b.created_at)) + '</div>'
            + '<div class="row"><strong>Name</strong>' + escapeHtml(b.name || '—') + '</div>'
            + '<div class="row"><strong>Phone</strong>' + escapeHtml(b.phone || '—') + '</div>'
            + '<div class="row"><strong>Email</strong>' + escapeHtml(b.email || '—') + '</div>'
            + '<div class="row"><strong>Organisation</strong>' + escapeHtml(b.organisation || '—') + '</div>'
            + '<div class="row"><strong>Area of Law</strong>' + escapeHtml(b.area || '—') + '</div>'
            + '<div class="row"><strong>Brief</strong>' + escapeHtml(b.note || '—') + '</div>'
            + '<div class="status-row">'
            + '<select data-id="' + b.id + '" class="booking-status">'
            + ['new','contacted','closed'].map(function(opt){
                return '<option value="' + opt + '"' + ((b.status || 'new') === opt ? ' selected' : '') + '>' + opt.charAt(0).toUpperCase() + opt.slice(1) + '</option>';
              }).join('')
            + '</select><span class="status-saved">Saved</span>'
            + '</div>'
            + '</div>';
        }).join('');
        Array.prototype.forEach.call(document.querySelectorAll('.booking-status'), function(sel){
          sel.addEventListener('change', function(){
            var id = sel.getAttribute('data-id');
            var savedEl = sel.parentElement.querySelector('.status-saved');
            sb.from('bookings').update({ status: sel.value }).eq('id', id).then(function(res){
              if(res.error){ alert('Could not update status: ' + res.error.message); return; }
              savedEl.style.display = 'inline';
              setTimeout(function(){ savedEl.style.display = 'none'; }, 1500);
            });
          });
        });
      });
  }

  function showTab(which){
    var postsBtn = document.getElementById('tab-posts-btn');
    var bookingsBtn = document.getElementById('tab-bookings-btn');
    var postsPanel = document.getElementById('panel-posts');
    var bookingsPanel = document.getElementById('panel-bookings');
    if(which === 'bookings'){
      postsBtn.classList.remove('active');
      bookingsBtn.classList.add('active');
      postsPanel.classList.add('hidden');
      bookingsPanel.classList.remove('hidden');
      if(!bookingsLoaded){ bookingsLoaded = true; loadBookings(); }
    } else {
      bookingsBtn.classList.remove('active');
      postsBtn.classList.add('active');
      bookingsPanel.classList.add('hidden');
      postsPanel.classList.remove('hidden');
    }
  }

  document.getElementById('tab-posts-btn').addEventListener('click', function(){ showTab('posts'); });
  document.getElementById('tab-bookings-btn').addEventListener('click', function(){ showTab('bookings'); });

  function showApp(session){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    document.getElementById('whoami').textContent = 'Signed in as ' + session.user.email;
    loadPosts();
  }

  sb.auth.getSession().then(function(res){
    if(res.data.session) showApp(res.data.session);
  });

  document.getElementById('login-btn').addEventListener('click', function(){
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    if(!email || !password){ showMsg(loginMsg, 'Enter your email and password.', true); return; }
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      if(res.error){ showMsg(loginMsg, res.error.message, true); return; }
      showApp(res.data.session);
    });
  });

  document.getElementById('logout-btn').addEventListener('click', function(){
    sb.auth.signOut().then(function(){
      appView.classList.add('hidden');
      loginView.classList.remove('hidden');
      bookingsLoaded = false;
      showTab('posts');
    });
  });

  document.getElementById('submit-btn').addEventListener('click', function(){
    var author = document.getElementById('post-author').value.trim();
    var title = document.getElementById('post-title').value.trim();
    var content = document.getElementById('post-content').value.trim();
    var imageFile = document.getElementById('post-image').files[0];
    if(!author || !title || !content){ showMsg(submitMsg, 'Fill in all fields.', true); return; }

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;

    function insertPost(imageUrl){
      var row = { author: author, title: title, content: content, status: 'pending' };
      if(imageUrl) row.image_url = imageUrl;
      sb.from('blog_posts').insert(row).then(function(res){
        btn.disabled = false;
        if(res.error){ showMsg(submitMsg, res.error.message, true); return; }
        showMsg(submitMsg, 'Submitted — it will appear on the site once the admin reviews it.', false);
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('post-image').value = '';
        sb.auth.getSession().then(function(r){ if(r.data.session) loadPosts(); });
      });
    }

    if(imageFile){
      var ext = (imageFile.name.split('.').pop() || 'jpg').toLowerCase();
      var path = slugify(title) + '-' + Date.now() + '.' + ext;
      sb.storage.from('blog-images').upload(path, imageFile, { upsert: true }).then(function(uploadRes){
        if(uploadRes.error){
          btn.disabled = false;
          showMsg(submitMsg, uploadRes.error.message, true);
          return;
        }
        var publicUrl = sb.storage.from('blog-images').getPublicUrl(path).data.publicUrl;
        insertPost(publicUrl);
      });
    } else {
      insertPost(null);
    }
  });
</script>
</body>
</html>
